[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
# Aevum's EVM is Shanghai — Cancun opcodes (MCOPY/TSTORE/PUSH0 is fine, but
# TSTORE etc.) revert on-chain, so pin the target explicitly.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[profile.ci]
verbosity = 2

# Aevum testnet (chain 44005). Deployment is done manually in a later step;
# these entries only document the target network.
[rpc_endpoints]
aevum_testnet = "https://rpc-test.qday.info"

[etherscan]
# Explorer verification is not available yet on Aevum testnet (per the
# official starter-kit docs); submissions cite the contract address plus the
# exact deployed commit instead.
